[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-id-verification"
version = "0.1.0"
description = "Face identity verification pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "google-cloud-vision>=3.5.0",
    "requests>=2.31.0",
    "web3>=8.0.0",
    "py-solc-x>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27.0"]

[project.scripts]
face-id-verification = "face_id_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_id_verification = ["contracts/*.sol", "web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access to download test images",
]
