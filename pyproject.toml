[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-id-verification"
version = "0.1.0"
description = "MukhdaX face identity verification pipeline (See. Trace. Verify.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "web3>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Contract deployment only. Recording a verification and reading it back need the packaged
# ABI, so an ordinary install never needs a Solidity compiler.
contract = ["py-solc-x>=2.0.0"]
# Legacy Google Cloud Vision Web Detection provider. Not used by the default
# SerpApi Google Lens path; the package imports without it.
gcv = ["google-cloud-vision>=3.5.0"]
# The packaging regression tests in tests/test_package.py build real wheels with
# `python -m build --no-isolation`. No isolation means no implicit environment, so the
# frontend and the build backend both have to be present. setuptools and wheel mirror
# [build-system].requires on purpose. All three are test tooling: installing the package
# never compiles anything.
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    "build>=1.0",
    "setuptools>=68.0",
    "wheel",
]

[project.scripts]
face-id-verification = "face_id_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_id_verification = [
    "contracts/*.sol",
    "contracts/*.abi.json",
    "py.typed",
    "web/static/*",
    "web/static/assets/*",
    "web/static/assets/branding/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that cross a real external boundary (network, blockchain, paid service)",
    "needs_model: tests that initialize insightface/onnxruntime and may download ~300 MB of model weights",
    "needs_network: tests that contact external hosts (randomuser.me, example.com, etc.)",
    "needs_credentials: tests that require SERPAPI_API_KEY, SEPOLIA_RPC_URL, SEPOLIA_PRIVATE_KEY, or Google ADC",
    "needs_solc: tests that genuinely require a real solc compiler to compile Solidity contracts",
]
