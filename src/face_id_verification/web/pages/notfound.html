<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MukhdaX: the requested evidence path does not exist." />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Signal lost — MukhdaX</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --border: #1c1c1c;
        --accent: #5ed29c;
        --soft: #b7bbc2;
        --muted: #8a8f98;
        --font-display: "Century Gothic", "Avenir Next", Avenir, Montserrat,
          "Trebuchet MS", sans-serif;
        --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: var(--bg);
        color: var(--soft);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
        padding: 24px;
      }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .code {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--accent);
        margin: 0 0 14px;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(44px, 7vw, 84px);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }
      p { max-width: 44ch; margin: 18px 0 0; color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 20px;
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--accent);
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 &middot; TRACE TERMINATED</p>
      <h1>SIGNAL LOST</h1>
      <p>The requested evidence path does not exist on this instance.</p>
      <a href="/">RETURN TO MUKHDAX</a>
    </main>
  </body>
</html>
